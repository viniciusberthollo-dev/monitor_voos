name: Monitor Voos Diretos GRU-MAD 2027

on:
  schedule:
    # A cada 2 dias às 09:00 BRT (12:00 UTC) -> ~240 consultas/mês (dentro do limite de 250)
    - cron: "0 12 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checar-tarifas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Executar monitoramento e ler comandos do Telegram
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python monitor_voos.py

      - name: Salvar configuração atualizada via Telegram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json .telegram_offset.json
          git diff --staged --quiet || git commit -m "chore: atualiza parâmetros via Telegram"
          git push
